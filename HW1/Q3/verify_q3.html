<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Q3 DOM verification</title>
</head>
<body>
<iframe id="f" src="Q3.html" style="width:950px;height:450px;border:1px solid #ccc"></iframe>
<pre id="out" style="font-size:12px;background:#f5f5f5;padding:10px;"></pre>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var doc = document.getElementById('f').contentDocument;
    var out = [];
    var svg = doc.getElementById('svg1');
    out.push('svg1: ' + (svg ? svg.tagName + ' width=' + svg.getAttribute('width') +
      ' height=' + svg.getAttribute('height') : 'MISSING'));
    ['container', 'bars', 'x_axis', 'x_axis_label', 'y_axis', 'y_axis_label', 'credit', 'title'].forEach(function (id) {
      var el = doc.getElementById(id);
      if (!el) { out.push(id + ': MISSING'); return; }
      var parent = el.parentNode && (el.parentNode.id || el.parentNode.tagName);
      out.push(id + ': <' + el.tagName.toLowerCase() + '> parent=' + parent +
        ' children=' + el.children.length + ' text="' + (el.textContent || '').slice(0, 60) + '"');
    });
    var rects = doc.querySelectorAll('#bars rect');
    out.push('rects inside #bars: ' + rects.length);
    for (var i = 0; i < rects.length; i++) {
      var r = rects[i];
      out.push('  rect' + i + ': y=' + r.getAttribute('y') + ' width=' + r.getAttribute('width') +
        ' height=' + r.getAttribute('height') + ' fill=' + r.getAttribute('fill'));
    }
    var xt = doc.querySelectorAll('#x_axis .tick text');
    out.push('x-axis ticks: [' + Array.prototype.map.call(xt, function (t) { return t.textContent; }).join(', ') + ']');
    var yt = doc.querySelectorAll('#y_axis .tick text');
    out.push('y-axis ticks: [' + Array.prototype.map.call(yt, function (t) { return t.textContent; }).join(', ') + ']');
    out.push('page <title>: ' + doc.title);
    document.getElementById('out').textContent = out.join('\n');
  }, 1200);
});
</script>
</body>
</html>
