<!DOCTYPE html>
<!-- cse6242 -->

<!-- run: http-server & -->

<head>
  <style>    
    /* Define css rules here */
    body {
      font-family: Helvetica, Arial, sans-serif;
    }
  </style>
<title>Wildlife Trafficking Incidents per Species (2015 to 2023)</title>
</head>

<body>

  <script src="lib/d3/d3.min.js"></script>
  <script src="lib/d3-dsv/d3-dsv.min.js"></script>
  <script src="lib/d3-fetch/d3-fetch.min.js"></script>


  <script>
    // define the dimensions and margins for the graph
    var margin = { top: 60, right: 30, bottom: 70, left: 150 };
    var width = 900 - margin.left - margin.right;
    var height = 370 - margin.top - margin.bottom;


    // create scales x & y for X and Y axis and set their ranges
    var x = d3.scaleLinear().range([0, width]);
    var y = d3.scaleBand().range([0, height]).padding(0.2);


    // append svg element to the body of the page
    var svg = d3.select("body").append("svg")
	   	// set the id, dimensions and position of the svg element 	
      .attr("id", "svg1")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
	   	.append("g")
	    .attr("id", "container")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")");


    // Get the data and filter for top 5 most trafficked species
	  var pathToCsv = "q3.csv";		// path to csv
	
    d3.dsv(",", pathToCsv, function (d) {
      return {
        // format data attributes if required
        species: d.species,
        count: +d.count
      }
    }).then(function (data) {
      console.log(data); // you should see the data in your browser's developer tools console 
      
      /* Create bar plot using data from csv */

      // keep only the top 5 most trafficked species, greatest to least
      data = data.sort(function (a, b) { return b.count - a.count; }).slice(0, 5);

      // set the domains of X and Y scales based on data
      x.domain([0, d3.max(data, function (d) { return d.count; })]);
      y.domain(data.map(function (d) { return d.species; }));

      // colorblind-safe palette (Okabe-Ito), one unique color per bar
      var colors = ["#0072B2", "#E69F00", "#009E73", "#CC79A7", "#56B4E9"];

      // Add bars to svg - create new elements based on your data
      svg.append("g")
        .attr("id", "bars")
        .selectAll("rect")
        .data(data)
        .enter()
        .append("rect")
        .attr("x", function (d) { return x(0); })
        .attr("y", function (d) { return y(d.species); })
        .attr("width", function (d) { return x(d.count); })
        .attr("height", y.bandwidth())
        .attr("fill", function (d, i) { return colors[i]; });

      // Add the X Axis
      svg.append("g")
        .attr("id", "x_axis")
        .attr("transform", "translate(0," + height + ")")
        .call(d3.axisBottom(x)
          .tickValues(d3.range(0, d3.max(data, function (d) { return d.count; }) + 1, 500)));

      // Add the text label for X Axis
      svg.append("text")
        .attr("id", "x_axis_label")
        .attr("x", width / 2)
        .attr("y", height + 45)
        .attr("text-anchor", "middle")
        .style("font-size", "14px")
        .text("Count");

      // Add the Y Axis
      svg.append("g")
        .attr("id", "y_axis")
        .call(d3.axisLeft(y));

      // Add the text label for Y axis
      svg.append("text")
        .attr("id", "y_axis_label")
        .attr("transform", "rotate(-90)")
        .attr("x", 0 - height / 2)
        .attr("y", 0 - margin.left + 50)
        .attr("text-anchor", "middle")
        .style("font-size", "14px")
        .text("Species");

      // Add GT username
      svg.append("text")
        .attr("id", "credit")
        .attr("x", width)
        .attr("y", height + 62)
        .attr("text-anchor", "end")
        .style("font-size", "12px")
        .text("sghaderi6");

      // Add Title
      svg.append("text")
        .attr("id", "title")
        .attr("x", width / 2)
        .attr("y", 0 - 25)
        .attr("text-anchor", "middle")
        .style("font-size", "16px")
        .style("font-weight", "bold")
        .text("Wildlife Trafficking Incidents per Species (2015 to 2023)");


    }).catch(function (error) {
      console.log(error);
    });

  </script>
</body>
